<svg xmlns="http://www.w3.org/2000/svg" width="400" height="66" viewBox="0 0 400 66" role="img" aria-label="Background. "><title>Background. </title><style>@keyframes fi{from{opacity:0;transform:translateY(8px)}}@keyframes fo{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1}}@keyframes gx{from{transform:scaleX(.001)}}@keyframes gy{from{transform:scaleY(.001)}}@keyframes pp{from{opacity:0;transform:scale(.3)}}@keyframes pl{50%{opacity:.3}}@keyframes ring{0%{opacity:.75;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.8)}}@keyframes bl{50%{opacity:0}}@keyframes tr{to{stroke-dashoffset:-1}}@keyframes sl{to{transform:translate(-70px,26px)}}@keyframes wv{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}@keyframes spin{to{transform:rotate(360deg)}}.fi{animation:fi .8s cubic-bezier(.2,.7,.2,1) both}.fo{animation:fo .9s ease both}.dr{stroke-dasharray:1;animation:dr 1.6s cubic-bezier(.6,0,.2,1) both}.gx{transform-box:fill-box;transform-origin:left center;animation:gx 1.2s cubic-bezier(.2,.7,.2,1) both}.gy{transform-box:fill-box;transform-origin:center bottom;animation:gy 1s cubic-bezier(.2,.7,.2,1) both}.pp{transform-box:fill-box;transform-origin:center;animation:pp .45s cubic-bezier(.3,1.5,.5,1) both}.pl{animation:pl 2.6s ease-in-out infinite}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}.bl{animation:bl 1.05s steps(1) infinite}.tr{stroke-dasharray:.12 .88;animation:tr 7s linear infinite}.sl{animation:sl 9s ease-in-out infinite alternate}.wv{transform-box:fill-box;transform-origin:center bottom;animation:wv 1.8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="0.0" y="16.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#a99cff" text-anchor="start" class="fo">~/background</text><rect x="91.8" y="6" width="7" height="12" fill="#a99cff" class="bl"/><text x="0.0" y="46.0" font-family="-apple-system,Bli