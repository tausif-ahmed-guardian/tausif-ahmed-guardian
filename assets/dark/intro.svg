<svg xmlns="http://www.w3.org/2000/svg" width="840" height="156" viewBox="0 0 840 156" role="img" aria-label="I've spent more than a decade on the side of security that has to stand up in front of an auditor: controls, evidence, risk, and the frameworks that tie them together. Now I build products and companies in that space, and I give back to the open standards and tools the field runs on."><title>I've spent more than a decade on the side of security that has to stand up in front of an auditor: controls, evidence, risk, and the frameworks that tie them together. Now I build products and companies in that space, and I give back to the open standards and tools the field runs on.</title><style>@keyframes fi{from{opacity:0;transform:translateY(8px)}}@keyframes fo{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1}}@keyframes gx{from{transform:scaleX(.001)}}@keyframes gy{from{transform:scaleY(.001)}}@keyframes pp{from{opacity:0;transform:scale(.3)}}@keyframes pl{50%{opacity:.3}}@keyframes ring{0%{opacity:.75;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.8)}}@keyframes bl{50%{opacity:0}}@keyframes tr{to{stroke-dashoffset:-1}}@keyframes sl{to{transform:translate(-70px,26px)}}@keyframes wv{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}@keyframes spin{to{transform:rotate(360deg)}}.fi{animation:fi .8s cubic-bezier(.2,.7,.2,1) both}.fo{animation:fo .9s ease both}.dr{stroke-dasharray:1;animation:dr 1.6s cubic-bezier(.6,0,.2,1) both}.gx{transform-box:fill-box;transform-origin:left center;animation:gx 1.2s cubic-bezier(.2,.7,.2,1) both}.gy{transform-box:fill-box;transform-origin:center bottom;animation:gy 1s cubic-bezier(.2,.7,.2,1) both}.pp{transform-box:fill-box;transform-origin:center;animation:pp .45s cubic-bezier(.3,1.5,.5,1) both}.pl{animation:pl 2.6s ease-in-out infinite}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}.bl{animation:bl 1.05s steps(1) infinite}.tr{stroke-dasharray:.12 .88;animation:tr 7s linear infinite}.sl{animation:sl 9s ease-in-out infinite alternate}.wv{transform-box:fill-box;transform-origin:center bottom;animation:wv 1.8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="839.0" height="155.0" rx="12" fill="#11161d" stroke="#262d38"/><rect x="0.5" y="0.5" width="839" height="155" rx="12" fill="none" stroke="#a99cff" stroke-width="1.6" pathLength="1" class="tr" style="animation-duration:10s;animation-delay:-0.00s" stroke-opacity=".9"/><rect x="0.5" y="28" width="3" height="90" fill="#a99cff" class="gy"/><text x="28.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start" class="fi" style="animation-delay:0.10s">I've spent more than a decade on the side of security that has to stand up in front of an</text><text x="28.0" y="68.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start" class="fi" style="animation-delay:0.19s">auditor: controls, evidence, risk, and the frameworks that tie them together. Now I build</text><text x="28.0" y="92.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start" class="fi" style="animation-delay:0.28s">products and companies in that space, and I give back to the open standards and tools the field</text><text x="28.0" y="116.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start" class="fi" style="animation-delay:0.37s">runs on.</text></svg>
