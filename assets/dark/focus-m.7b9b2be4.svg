<svg xmlns="http://www.w3.org/2000/svg" width="400" height="613" viewBox="0 0 400 613" role="img" aria-label="Focus. Governance, risk and compliance: ISO 27001, SOC 2, CMMI, GDPR, India's DPDP Act, SOX 404 and ITGC. One control mapped to many requirements, evidence automation, third-party risk. AI security and governance: ISO/IEC 42001, NIST AI RMF and the EU AI Act. Prompt injection, data leakage and over-privileged tools, and the evidence that proves an AI control works. Post-quantum readiness: FIPS 203, 204 and 205. Crypto inventory first (CBOM), then migration run as a governance problem: owners, timelines, vendor dependencies, evidence. Cybersecurity: Turning advisories (CISA KEV, vendor PSIRTs) into actions a team can take this week. Security programmes that pass an audit without becoming paperwork."><title>Focus. Governance, risk and compliance: ISO 27001, SOC 2, CMMI, GDPR, India's DPDP Act, SOX 404 and ITGC. One control mapped to many requirements, evidence automation, third-party risk. AI security and governance: ISO/IEC 42001, NIST AI RMF and the EU AI Act. Prompt injection, data leakage and over-privileged tools, and the evidence that proves an AI control works. Post-quantum readiness: FIPS 203, 204 and 205. Crypto inventory first (CBOM), then migration run as a governance problem: owners, timelines, vendor dependencies, evidence. Cybersecurity: Turning advisories (CISA KEV, vendor PSIRTs) into actions a team can take this week. Security programmes that pass an audit without becoming paperwork.</title><style>@keyframes fi{from{opacity:0;transform:translateY(8px)}}@keyframes fo{from{opacity:0}}@keyframes dr{from{stroke-dashoffset:1}}@keyframes gx{from{transform:scaleX(.001)}}@keyframes gy{from{transform:scaleY(.001)}}@keyframes pp{from{opacity:0;transform:scale(.3)}}@keyframes pl{50%{opacity:.3}}@keyframes ring{0%{opacity:.75;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.8)}}@keyframes bl{50%{opacity:0}}@keyframes tr{to{stroke-dashoffset:-1}}@ke